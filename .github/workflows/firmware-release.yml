name: ESP32 firmware release

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'tools/firmware_release.py'
      - '.github/workflows/firmware-release.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/firmware_release.py'
      - '.github/workflows/firmware-release.yml'
  workflow_dispatch:

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build tooling
        run: python -m pip install platformio==6.2.0
      - name: Build ESP32 application
        run: pio run -d firmware
      - name: Package application and integrity manifest
        run: python tools/firmware_release.py --source-commit "$GITHUB_SHA"
      - name: Publish stable firmware release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json,pathlib; print(json.loads(next(pathlib.Path("release").glob("*.json")).read_text())["version"])')"
          tag="firmware-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing-release.json 2>/dev/null; then
            if python -c 'import json,sys; sys.exit(0 if json.load(open("existing-release.json"))["isDraft"] else 1)'; then
              echo "Completing an unpublished draft release."
            else
              echo "This firmware version is already published and will not be overwritten. Bump FPS_VERSION for a new firmware version."
              exit 0
            fi
          else
            printf '%s\n' "ESP32 firmware ${version} for Fajny Print Studio." "Board: esp32dev; OTA layout: dual1856-v1." "Install through the application's Aktualizácie section. Initial OTA migration requires USB; see docs/OTA.md." > release-notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ESP32 firmware ${version}" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
