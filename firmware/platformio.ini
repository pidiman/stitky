[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_ota.csv
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  adafruit/Adafruit NeoPixel@1.12.3
build_flags =
  -DLED_PIN=18
  -DLED_COUNT=1
  -DLED_BRIGHTNESS=32
  -DOLED_SDA=21
  -DOLED_SCL=22
